name: Build Android APK

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # ── Next.js static export (Capacitor web dir) ──────────────────────────
      - name: Build Next.js (static export)
        run: npm run build:mobile
        env:
          MOBILE_BUILD: "true"
          # Suppress Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"

      # ── Java / Android SDK ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Capacitor Android project ─────────────────────────────────────────
      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      # ── Gradle build ──────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openmail-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── (Optional) release build — only on version tags ────────────────────
      # Uncomment and add KEYSTORE_* secrets to enable signed release APKs.
      #
      # - name: Build release APK
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   working-directory: android
      #   run: |
      #     ./gradlew assembleRelease \
      #       -Pandroid.injected.signing.store.file=${{ secrets.KEYSTORE_PATH }} \
      #       -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
      #       -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
      #       -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
      #       --no-daemon
      #
      # - name: Upload release APK
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: openmail-release-${{ github.ref_name }}
      #     path: android/app/build/outputs/apk/release/app-release.apk
